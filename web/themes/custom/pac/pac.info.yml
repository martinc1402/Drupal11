name: pac
type: theme
"base theme": stable9
version: 1.0.0
libraries:
  - pac/base
  - pac/messages
  - core/normalize
libraries-extend:
  user/drupal.user:
    - pac/user
  core/drupal.dropbutton:
    - pac/dropbutton
  core/drupal.dialog:
    - pac/dialog
  file/drupal.file:
    - pac/file
  core/drupal.progress:
    - pac/progress
  core/drupal.tablesort:
    - pac/drupal.tablesort
description: ""
core_version_requirement: ^10 || ^11
generator: "starterkit_theme:11.2.0"

components:
  namespaces:
    atoms:
      - src/components/01-atoms
    molecules:
      - src/components/02-molecules
    organisms:
      - src/components/03-organisms
    layouts:
      - src/components/04-layouts
    pages:
      - src/components/05-pages
    templates:
      - src/templates

regions:
  header: "Header"
  banner: "Banner"
  highlighted: "Highlighted"
  content_top: "Content Top"
  content: "Content"
  content_bottom: "Content Bottom"
  sidebar_left: "Sidebar Left"
  sidebar_right: "Sidebar Right"
  footer: "Footer"
  hidden: "Hidden"
